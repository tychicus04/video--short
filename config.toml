tts_model = "gemini-2.5-flash-preview-tts"
voice = "Charon"
# said to Gemini before the script; the pace knob (NotebookLM reads calmly, Gemini alone rushes)
tts_style = "Read this Vietnamese narration at a natural, steady pace, clear and unhurried like a documentary narrator but not slow, with a short pause after each sentence:"
zerotts_model = "~/models/zerotts"  # weights copied as real files: onnxruntime refuses the HF cache's symlinks
zerotts_voice = "quangminh"
env_file = "~/Document/notebooklm-py-main/.env"
notebooklm_dir = "~/Document/notebooklm-py-main"
runs_dir = "~/notebooklm-videos"
# the web control panel (`vshort web`): its port, how many videos it runs at once, where its login token lives
web_port = 8770
web_max_running = 3
web_token_file = "~/.config/vshort/web_token"
# `vshort cms`: which CMS (dev/prod) and its ids; the machine token sits in a file of its own (mode 600) named there
cms_file = "~/.config/vshort/cms.toml"
