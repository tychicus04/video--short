[project]
name = "vshort"
version = "0.1.0"
description = "Turn an English NotebookLM short into a Vietnamese-dubbed vertical video"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "pillow", "imageio-ffmpeg", "torch", "google-genai", "cairosvg>=2.9.1", "starlette>=0.39", "uvicorn"]

[project.scripts]
vshort = "vshort.cli:main"

[dependency-groups]
dev = ["pytest", "httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vshort"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
